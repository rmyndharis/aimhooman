name: release

# Publish to npm when a version tag is cut. Trigger locally with:
#   git tag -a v0.1.0 -m v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  id-token: write # trusted-publishing OIDC exchange + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Verify runs check:static, which runs the pinned actionlint through `go run`.
      # A tag push triggers no other workflow, so this job is the only gate at tag
      # time; without this step it would run on whatever Go the runner image ships.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify
        run: npm run verify
      # Trusted publishing: npm exchanges the job's OIDC identity for a
      # short-lived credential, so no npm secret is stored anywhere. The
      # publisher registered on npmjs.com pins this repository and this exact
      # workflow filename, which is why renaming this file breaks publishing.
      # --access is unnecessary (publishConfig.access already says public).
      - name: Publish to npm
        run: npm publish --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --verify-tag
