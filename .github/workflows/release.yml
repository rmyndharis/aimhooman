name: release

# Publish to npm when a version tag is cut. Trigger locally with:
#   git tag -a v0.1.0 -m v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Verify runs the locked dev packages and actionlint, so it gets no write
  # access. It hands the tarball it tested to the publish job.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Verify runs check:static, which runs the pinned actionlint through `go run`.
      # A tag push triggers no other workflow, so this job is the only gate at tag
      # time; without this step it would run on whatever Go the runner image ships.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify
        env:
          AIMHOOMAN_ARTIFACT_DIR: ${{ runner.temp }}/package
        run: npm run verify
      - name: Keep the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          overwrite: true # a re-run of verify replaces the package an earlier attempt kept

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # trusted-publishing OIDC exchange + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require a tag on main that names the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tagged commit $GITHUB_SHA is not on main" >&2
            exit 1
          }
          VERSION=$(node -p "require('./package.json').version")
          [ "$TAG" = "v$VERSION" ] || {
            echo "tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          }
      - name: Download the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Trusted publishing: npm exchanges the job's OIDC identity for a
      # short-lived credential, so no npm secret is stored anywhere. The
      # publisher registered on npmjs.com pins this repository and this exact
      # workflow filename, which is why renaming this file breaks publishing.
      # --access is unnecessary (publishConfig.access already says public).
      # npm names the tarball after the package and version; the step above
      # already tied that version to the tag.
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: npm publish "$RUNNER_TEMP/package/rmyndharis-aimhooman-${TAG#v}.tgz" --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --verify-tag
