name: aimhooman
description: keeps AI session files and attribution out of commits
inputs:
  base:
    description: base of the range to scan (triple-dot merge base applies); an all-zero object ID, as on the first push of a branch, scans from the merge base with origin/<default branch>, or from the root commit when there is none
    required: true
  head:
    description: head of the range to scan
    required: true
  profile:
    description: policy profile to enforce; strict works in any repository, while clean or compliance must match the profile committed in .aimhooman.json (clean when none is committed)
    required: false
    default: strict
  version:
    description: aimhooman npm version to install (pin this; the action tag does not pin the CLI)
    required: false
    default: latest
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
    - name: Install aimhooman
      run: npm install -g @rmyndharis/aimhooman@"$AIMHOOMAN_VERSION"
      shell: bash
      env:
        AIMHOOMAN_VERSION: ${{ inputs.version }}
    - name: Check the introduced commits
      run: |
        # A push that creates a branch reports an all-zero base. Scan what the
        # branch adds to the default branch, not every commit it inherits.
        if [[ "$BASE" =~ ^(0{40}|0{64})$ ]]; then
          BASE=$(node --input-type=module -e '
            import { join } from "node:path";
            import { pathToFileURL } from "node:url";
            const { GITHUB_ACTION_PATH, BASE, HEAD, REF_NAME, DEFAULT_BRANCH } = process.env;
            const { selectPushBase } = await import(pathToFileURL(join(GITHUB_ACTION_PATH, "src", "history-scan.mjs")));
            process.stdout.write(selectPushBase({
              before: BASE, head: HEAD, refName: REF_NAME, defaultBranch: DEFAULT_BRANCH, cwd: process.cwd(),
            }) ?? "");
          ')
          if [ -z "$BASE" ]; then
            echo "aimhooman: $HEAD adds no commits outside $DEFAULT_BRANCH"
            exit 0
          fi
        fi
        aimhooman check --range "$BASE...$HEAD" --profile "$PROFILE"
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        PROFILE: ${{ inputs.profile }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
